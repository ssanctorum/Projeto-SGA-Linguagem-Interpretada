<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="assets/icons/favicon.png">
    <title>Área do Professor - Universidade de Viktor Chondria</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/home.css">
    <link rel="stylesheet" href="css/notas.css">
</head>
<body class="pagina-home">
    <header class="cabecalho-home">
        <div class="identidade-instituicao">
            <h1>Universidade de Viktor Chondria</h1>
            <p>Sistema de Gestão Acadêmica</p>
        </div>

        <div class="usuario-logado">
            <div class="avatar-usuario" id="avatar-usuario">PR</div>

            <div class="informacoes-usuario">
                <span>Professor</span>
                <strong id="nome-professor">Nome do professor</strong>
            </div>

            <button type="button" class="botao-sair" id="botao-sair">Sair</button>
        </div>
    </header>

    <div class="estrutura-home">
        <aside class="menu-lateral">
            <nav>
                <button type="button" class="item-menu ativo" id="menu-turmas">
                    Minhas turmas
                </button>

                <button type="button" class="item-menu" id="menu-perfil">
                    Meu perfil
                </button>
            </nav>
        </aside>

        <main class="conteudo-principal" id="conteudo-principal">
            <p class="mensagem-carregamento">Carregando turmas...</p>
        </main>
    </div>

    <script src="js/dados.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/notas.js"></script>
    <script src="js/perfil.js"></script>
    <script src="js/turmas.js"></script>
</body>
</html>
