<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Universidade de To-Oh</title>
</head> 
<body>
    <header>
        <hero>
            <h2>Em breve você fará parte da Universidade de To-Oh</h2>
            <p>Preencha o formulário abaixo para criar sua conta.</p>    
        </hero>
    </header>
    <main>
        <div class="card">
        <p>Cadastro</p>
            <form id="form-cadastro">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" required>
                <br>
                <label for="sobrenome">Sobrenome:</label>
                <input type="text" id="sobrenome" name="sobrenome" required>
                <br>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
                <br>
                <label for="password">Senha:</label>
                <input type="password" id="password" name="password" required>
                <br>
                <input type="submit" value="Criar Conta">
            </form>
            <p>Já tem uma conta? <a href="index.html">Faça login aqui</a></p>
        </div>
    </main>
    <footer>
        <p>&copy; 2024 Universidade de To-Oh. Todos os direitos reservados.</p>
    </footer>
    <script src="js/auth.js"></script>
</body>
</html>
