<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="assets/icons/favicon.png">
    <title>Cadastro - Universidade de Viktor Chondria</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/cadastro.css">
</head> 
<body>
    <header>
        <hero>
            <h2>Em breve você fará parte da Universidade de Viktor Chondria</h2>
            <p>Preencha o formulário abaixo para criar sua conta.</p>    
        </hero>
    </header>
    <main>
        <div class="card">
        <p>Cadastro</p>
            <form id="form-cadastro">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" required>
                <br>
                <label for="sobrenome">Sobrenome:</label>
                <input type="text" id="sobrenome" name="sobrenome" required>
                <br>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
                <br>
                <label for="password">Senha:</label>
                <input type="password" id="password" name="password" required>
                <br>
                <input type="submit" value="Criar Conta">
            </form>
        <p>Já tem uma conta? <a href="index.html">Faça login aqui</a></p>
        </div>
    </main>
    <footer>
        <p>&copy; 2024 Universidade de Viktor Chondria. Todos os direitos reservados.</p>
    </footer>
    <script src="js/auth.js"></script>
</body>
</html>
